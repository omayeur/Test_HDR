[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stl-deviation"
version = "0.1.0"
description = "Quantify and visualise the geometric deviation between two STL surfaces (e.g. manual vs. automatic segmentation)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Olivier Mayeur" }]
keywords = ["STL", "segmentation", "surface distance", "Hausdorff", "biomechanics", "medical imaging"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.scripts]
stl-deviation = "stl_deviation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
